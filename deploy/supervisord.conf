[unix_http_server]
file=%(ENV_NETRYX_DEPLOY_DIR)s/supervisor.sock
chmod=0600

[supervisord]
logfile=%(ENV_NETRYX_DEPLOY_DIR)s/supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=%(ENV_NETRYX_DEPLOY_DIR)s/supervisor.pid
childlogdir=%(ENV_NETRYX_DEPLOY_DIR)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_NETRYX_DEPLOY_DIR)s/supervisor.sock

[program:netryx-api]
command=/bin/sh %(ENV_NETRYX_ROOT)s/deploy/run-api.sh
directory=%(ENV_NETRYX_ROOT)s
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=%(ENV_NETRYX_DEPLOY_DIR)s/api.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:netryx-tunnel]
command=%(ENV_NETRYX_CLOUDFLARED)s tunnel --config %(ENV_NETRYX_DEPLOY_DIR)s/tunnel.yml run
autostart=%(ENV_NETRYX_TUNNEL_ENABLED)s
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_NETRYX_DEPLOY_DIR)s/tunnel.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
